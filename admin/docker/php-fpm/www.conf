[www]
user = www-data
group = www-data

; Listen on a unix socket shared with nginx
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface worker output to container logs
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
