; Production PHP settings for the Nova admin container
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 68M
expose_php = Off

; l1/Saloon on PHP 8.4 emit harmless E_DEPRECATED nullable-param notices.
; Keep errors out of the response body; supervisor/php-fpm log to stderr.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC
