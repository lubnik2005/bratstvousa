name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/security/secrets.py history

  php:
    name: PHP release currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/security -p 'test_*.py'
      - run: python3 scripts/security/runtime.py

  composer:
    name: Composer advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD/admin:/app:ro" composer:2 --no-plugins --no-scripts audit --locked --no-interaction

  npm:
    name: npm advisories (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', admin, admin/nova-components/CampCheckIn, app, camp-paradise, camp-paradise-web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm audit --package-lock-only --ignore-scripts --audit-level=high
        working-directory: ${{ matrix.directory }}

  containers:
    name: Container advisories (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production-runtime
            file: admin/docker/Dockerfile
            context: admin
            target: runtime-base
          - name: development-runtime
            file: admin/runtimes/8.4/Dockerfile
            context: admin/runtimes/8.4
            target: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime without application credentials
        env:
          DOCKERFILE: ${{ matrix.file }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build --pull --build-arg WWWGROUP=1000 "${args[@]}" -f "$DOCKERFILE" -t security-runtime "$CONTEXT"
      - name: Scan image (including unfixed HIGH/CRITICAL findings)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: security-runtime
          version: v0.76.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
