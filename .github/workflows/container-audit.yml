name: Container audits (manual during migration)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Container advisories (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production-runtime
            file: admin/docker/Dockerfile
            context: admin
            target: runtime-base
          - name: development-runtime
            file: admin/runtimes/8.4/Dockerfile
            context: admin/runtimes/8.4
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime without application credentials
        env:
          DOCKERFILE: ${{ matrix.file }}
          CONTEXT: ${{ matrix.context }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build --pull --build-arg WWWGROUP=1000 "${args[@]}" -f "$DOCKERFILE" -t security-runtime "$CONTEXT"
      - name: Scan image (including unfixed HIGH/CRITICAL findings)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: security-runtime
          version: v0.76.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
