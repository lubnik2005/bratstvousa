version: 2
multi-ecosystem-groups:
  weekly-maintenance:
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
registries:
  nova:
    type: composer-repository
    url: https://nova.laravel.com
    username: lubnik2005@gmail.com
    password: ${{ secrets.NOVA_LICENSE_KEY }}
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-maintenance
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
  # Docker proposals are paused during the server migration.
  - package-ecosystem: composer
    directory: /admin
    registries: [nova]
    ignore:
      # TEMPORARY: remove after renewing Nova download entitlement.
      # Renewal checklist: https://github.com/lubnik2005/bratstvousa/issues/28
      - dependency-name: laravel/nova
    patterns: ['*']
    multi-ecosystem-group: weekly-maintenance
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /
      - /admin
      - /admin/nova-components/CampCheckIn
      - /app
      - /camp-paradise
      - /camp-paradise-web
    patterns: ['*']
    multi-ecosystem-group: weekly-maintenance
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
