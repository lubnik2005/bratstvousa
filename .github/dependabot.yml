version: 2
registries:
  nova:
    type: composer-repository
    url: https://nova.laravel.com
    username: lubnik2005@gmail.com
    password: ${{ secrets.NOVA_LICENSE_KEY }}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /admin/docker
      - /admin/runtimes/8.4
      - /app
    schedule:
      interval: daily
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: composer
    directory: /admin
    registries: [nova]
    schedule:
      interval: daily
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
      - /admin
      - /admin/nova-components/CampCheckIn
      - /app
      - /camp-paradise
      - /camp-paradise-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        update-types: [minor, patch]
