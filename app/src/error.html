<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Bratstvo USA</title>
		<style>
			:root {
				--paper: #f6f2ea;
				--secondary: #a28c6a;
				--dark: #2c2b29;
				--ink-muted: #736a5f;
				--rule: #ddd5c8;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 4rem 1.5rem;
				background: var(--paper);
				color: var(--dark);
				font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				position: relative;
				overflow: hidden;
			}
			.watermark {
				position: absolute;
				top: 50%;
				left: 50%;
				width: min(60vw, 460px);
				transform: translate(-50%, -50%);
				color: var(--secondary);
				opacity: 0.05;
				pointer-events: none;
			}
			.inner {
				position: relative;
				text-align: center;
				max-width: 40rem;
			}
			.code {
				font-family: 'Lora', Georgia, serif;
				font-weight: 600;
				font-size: clamp(4.5rem, 14vw, 9rem);
				line-height: 1;
				color: var(--secondary);
				margin: 0 0 0.5rem;
			}
			.title {
				font-family: 'Lora', Georgia, serif;
				font-weight: 600;
				font-size: clamp(1.6rem, 4vw, 2.4rem);
				margin: 0 0 0.75rem;
			}
			.subtitle {
				color: var(--ink-muted);
				font-size: 1.05rem;
				margin: 0 auto 1.75rem;
				max-width: 32rem;
			}
			.btn {
				display: inline-block;
				padding: 0.65rem 1.75rem;
				background: #5a4a42;
				color: #fff;
				text-decoration: none;
				border: 1px solid #5a4a42;
			}
		</style>
	</head>
	<body>
		<svg class="watermark" viewBox="0 0 142 140" aria-hidden="true">
			<path d="M42 0 h16 v46 h42 v16 h-42 v78 h-16 v-78 h-42 v-16 h42 z" fill="currentColor" />
		</svg>
		<div class="inner">
			<p class="code">%sveltekit.status%</p>
			<h1 class="title">Что-то пошло не так</h1>
			<p class="subtitle">%sveltekit.error.message%</p>
			<a class="btn" href="/">Вернуться на главную</a>
		</div>
	</body>
</html>
