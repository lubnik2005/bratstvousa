<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.textDirection%">
	<head>
		<!-- Meta Tags -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Американское Объединение МСЦ ЕХБ</title>
		<meta name="description" content="Американское Объединение МСЦ ЕХБ" />
		<meta name="keywords" content="братство, отделеные, ЕХБ" />
		<meta name="author" content="Братство США" />

		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />

		<!-- Preconnect to external domains -->
		<link rel="preconnect" href="https://bratstvo-usa.s3.us-west-2.amazonaws.com" />

		<!-- Self-hosted fonts: served same-origin so they load before first paint.
		     Preload the latin subsets (critical path) to avoid any swap-driven
		     layout shift (CLS). font-display:swap + metric-matched fallbacks keep
		     text visible with no reflow. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/opensans-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/lora-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<style>
			/* Open Sans (body) — self-hosted */
			@font-face {
				font-family: 'Open Sans';
				font-style: normal;
				font-weight: 400 500;
				font-display: swap;
				src: url('/fonts/opensans-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
					U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
					U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Open Sans';
				font-style: normal;
				font-weight: 400 500;
				font-display: swap;
				src: url('/fonts/opensans-cyrillic.woff2') format('woff2');
				unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
			}
			/* Lora (headings) — self-hosted */
			@font-face {
				font-family: 'Lora';
				font-style: normal;
				font-weight: 600 700;
				font-display: swap;
				src: url('/fonts/lora-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
					U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
					U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Lora';
				font-style: normal;
				font-weight: 600 700;
				font-display: swap;
				src: url('/fonts/lora-cyrillic.woff2') format('woff2');
				unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
			}
			/* Metric-matched fallbacks (used only until the woff2 above load) */
			@font-face {
				font-family: 'Open Sans Fallback';
				src: local('Arial');
				size-adjust: 107%;
				ascent-override: 101%;
				descent-override: 28%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: 'Lora Fallback';
				src: local('Georgia');
				size-adjust: 104%;
				ascent-override: 97%;
				descent-override: 26%;
				line-gap-override: 0%;
			}
		</style>

		<!-- CSS - loaded asynchronously to avoid render blocking -->
		<link
			rel="preload"
			href="/css/main.min.css"
			as="style"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript><link href="/css/main.min.css" rel="stylesheet" /></noscript>

		<!-- Font Awesome - loaded asynchronously -->
		<link
			rel="preload"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
			as="style"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript
			><link
				href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
				rel="stylesheet"
		/></noscript>

		<!-- Bootstrap Icons - loaded asynchronously -->
		<link
			rel="preload"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
			as="style"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript
			><link
				href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
				rel="stylesheet"
		/></noscript>

		<!-- JavaScript Libraries -->
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		></script>
		<!-- Svelte Kit -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<p>JavaScript is required to run this application.</p>
		</noscript>
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
