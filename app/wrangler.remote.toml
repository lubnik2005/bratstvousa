# Remote-bindings variant of wrangler.toml, used ONLY by `npm run dev:remote`.
# It points the local dev server at PRODUCTION D1 and R2 via Wrangler remote bindings.
# WARNING: reads AND writes hit real production data. Do not use casually.
name = "bratstvousa"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# D1 Database binding (PRODUCTION, remote)
[[d1_databases]]
binding = "DB"
database_name = "bratstvousa-db"
database_id = "fdf9adc7-0fa2-420e-b492-64b497e740c9"
migrations_dir = "drizzle"
remote = true

# R2 Bucket binding (PRODUCTION, remote)
[[r2_buckets]]
binding = "R2"
bucket_name = "bratstvousa-media"
remote = true

[vars]
MEDIA_URL = "https://media.bratstvousa.com/"
# Cloudflare Turnstile (bot/spam protection). Site key is public.
# The secret key is stored as a Pages secret (TURNSTILE_SECRET_KEY), never committed.
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEzKpCgc4kC9UW8O"
TURNSTILE_HOSTNAMES = "www.bratstvousa.com,bratstvousa.com"
# Zeffy ticketing link sent to approved camp registrants (public URL).
ZEFFY_URL = "https://www.zeffy.com/en-US/ticketing/pnw-youth-camp--2026"
